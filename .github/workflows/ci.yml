name: framework-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 文档基线守卫需要完整历史做祖先校验

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest PyYAML jinja2 pystache pybars3

      - name: Static compile
        run: python -m compileall -q skills scripts tests conftest.py

      - name: Full test suite
        run: |
          python -m pytest -q 2>&1 | tee /tmp/ct-pytest.log
          TEST_COUNT=$(grep -oE '[0-9]+ passed' /tmp/ct-pytest.log | tail -1 | awk '{print $1}')
          if [ -z "$TEST_COUNT" ]; then
            echo "cannot parse pytest passed count from CI output" >&2
            exit 1
          fi
          echo "TEST_COUNT=$TEST_COUNT" >> "$GITHUB_ENV"

      - name: Registry matches code (no drift, rebuild is idempotent)
        run: |
          R=skills/capability-twin-orchestrator/capability_registry.json
          H_COMMITTED=$(sha256sum "$R" | cut -d' ' -f1)
          python scripts/discover_capabilities.py >/dev/null
          H_REBUILT=$(sha256sum "$R" | cut -d' ' -f1)
          if [ "$H_COMMITTED" != "$H_REBUILT" ]; then
            echo "registry drift: committed=$H_COMMITTED rebuilt=$H_REBUILT" >&2
            git --no-pager diff -- "$R" >&2 || true
            exit 1
          fi
          python scripts/discover_capabilities.py >/dev/null
          H_AGAIN=$(sha256sum "$R" | cut -d' ' -f1)
          test "$H_REBUILT" = "$H_AGAIN"

      - name: Ontology builder self-test
        run: python scripts/build_ontology.py --self-test

      - name: Ontology consumption guard (AGENT + evidence gate wiring)
        run: python scripts/check_ontology_contract.py --self-test

      - name: Ontology manifest guard (explicit skip when source absent)
        run: python scripts/check_ontology.py --manifest ontology/manifest.json --out /tmp/ontology-rebuilt

      - name: Install-layout self check
        run: python skills/capability-twin-orchestrator/scripts/framework_paths.py

      - name: Gherkin spec gate
        run: python skills/gherkin-bdd/scripts/gherkin_gate.py validate skills/gherkin-bdd/features

      - name: Documentation baseline guard (governance A+)
        run: |
          python scripts/check_docs_baseline.py --self-test
          python scripts/check_docs_baseline.py --test-count "$TEST_COUNT"
